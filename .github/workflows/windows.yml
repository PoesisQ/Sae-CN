name: Windows reader
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  reader:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      MUPDF_MSVC_PLATFORM_TOOLSET: v143
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check libclang==18.1.1 pillow
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $libclang = python -c "import clang.cindex as c; print(c.Config.library_path)"
          "LIBCLANG_PATH=$libclang" >> $env:GITHUB_ENV
          rustc -Vv
      - name: Restore the native build cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows2022-reader-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'vendor/**/build.rs', 'vendor/**/msbuild.rs') }}
          restore-keys: |
            windows2022-reader-
      - name: Run native Rust tests
        run: cargo test --locked --release --features qa
      - name: Build the window probe
        run: cargo build --locked --release --features qa --bin sae-reader
      - name: Cache the tested native build
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Verify the reading window and materials
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/sae-reader.exe'
          python scripts/qa-windows.py --exe $exe --no-activate --fixture tests/fixtures/core.pdf --scenario navigation --output artifacts/ci/navigation
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $layouts = [ordered]@{ single = @(); double = @('--spread'); multi = @('--multi') }
          foreach ($layout in $layouts.Keys) {
            $flags = $layouts[$layout]
            python scripts/qa-windows.py --exe $exe --no-activate --fixture tests/fixtures/core.pdf --scenario page-input --output "artifacts/ci/pan-$layout" @flags
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          python scripts/check-glass.py --exe $exe --scale 1.5 --output artifacts/ci/glass
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check-opening-transition.py --exe $exe --output artifacts/ci/opening
      - name: Exercise captured Win32 wheel input
        shell: pwsh
        run: |
          # The disposable runner owns this desktop. A small display must fit
          # both the window and the captured vertical drag below the zoom dial.
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop | Out-Null } catch { Write-Output $_ }
          }
          Add-Type -AssemblyName System.Windows.Forms
          $screen = [Windows.Forms.Screen]::PrimaryScreen.Bounds
          $env:SLINT_SCALE_FACTOR = if ($screen.Width -ge 1440 -and $screen.Height -ge 1000) { '1' } else { '0.7' }
          $exe = 'target/x86_64-pc-windows-msvc/release/sae-reader.exe'
          python scripts/check-wheel-input.py --exe $exe --output artifacts/ci/wheel-pdf
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check-wheel-input.py --exe $exe --epub --output artifacts/ci/wheel-epub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/qa-windows.py --exe $exe --scale 1.5 --scenario instruments --fixture tests/fixtures/core.pdf --output artifacts/ci/instruments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check-control-snapshots.py artifacts/ci/instruments/fixture-00.json --wheel-samples artifacts/ci/wheel-pdf artifacts/ci/wheel-epub
      - name: Drop files from Windows onto the reader
        shell: powershell
        run: |
          .\scripts\check-shell-drop.ps1 -Exe target/x86_64-pc-windows-msvc/release/sae-reader.exe -OutputDirectory artifacts/ci/shell-drop
      - name: Preserve native verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: artifacts/ci/**/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screen-diagnostics
          path: artifacts/ci/**/*.png
          if-no-files-found: ignore
          retention-days: 3
