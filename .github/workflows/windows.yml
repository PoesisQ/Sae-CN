name: Windows reader
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  reader:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      MUPDF_MSVC_PLATFORM_TOOLSET: v143
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check libclang==18.1.1 pillow
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $libclang = python -c "import clang.cindex as c; print(c.Config.library_path)"
          "LIBCLANG_PATH=$libclang" >> $env:GITHUB_ENV
          rustc -Vv
      - name: Cache locked dependencies and native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows2022-reader-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'vendor/**/build.rs', 'vendor/**/msbuild.rs') }}-${{ github.sha }}
          restore-keys: |
            windows2022-reader-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'vendor/**/build.rs', 'vendor/**/msbuild.rs') }}-
      - name: Run native Rust tests
        run: cargo test --locked --release --features qa
      - name: Build the window probe
        run: cargo build --locked --release --features qa --bin sae-reader
      - name: Verify the reading window and materials
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/sae-reader.exe'
          python scripts/qa-windows.py --exe $exe --no-activate --fixture tests/fixtures/core.pdf --scenario navigation --output artifacts/ci/navigation
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check-glass.py --exe $exe --scale 1.5 --output artifacts/ci/glass
      - name: Preserve native verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: artifacts/ci/**/*.json
          if-no-files-found: ignore
          retention-days: 7
